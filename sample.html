<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // Immersive Audio Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonGreen: '#00ff88',
                        neonCyan: '#00e5ff',
                        neonPurple: '#a855f7',
                        darkBase: '#090a0f',
                        darkCard: 'rgba(18, 22, 36, 0.7)',
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: {
                        'spin-slow': 'spin 12s linear infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { filter: 'drop-shadow(0 0 10px rgba(0,255,136,0.3))' },
                            '100%': { filter: 'drop-shadow(0 0 25px rgba(0,229,255,0.8))' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(10, 12, 18, 0.8); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff88; }
        .glass-panel { background: rgba(15, 20, 32, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(10, 12, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .loader-bar { animation: equalizer 1s ease-in-out infinite alternate; }
        .loader-bar:nth-child(1) { animation-delay: 0.1s; }
        .loader-bar:nth-child(2) { animation-delay: 0.4s; }
        .loader-bar:nth-child(3) { animation-delay: 0.2s; }
        .loader-bar:nth-child(4) { animation-delay: 0.5s; }
        .loader-bar:nth-child(5) { animation-delay: 0.3s; }
        @keyframes equalizer { 0% { height: 12%; } 100% { height: 100%; } }
        .ambient-bg { position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; }
        .paused-spin { animation-play-state: paused !important; }
        input[type="range"] { -webkit-appearance: none; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; height: 4px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #00ff88; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 136, 0.8); }
    </style>
</head>
<body class="bg-darkBase text-slate-100 font-sans h-full overflow-hidden select-none">
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div id="orb-1" class="glow-orb bg-neonGreen w-[500px] h-[500px] -top-32 -left-32"></div>
        <div id="orb-2" class="glow-orb bg-neonCyan w-[600px] h-[600px] -bottom-32 -right-32"></div>
        <div id="orb-3" class="glow-orb bg-neonPurple w-[400px] h-[400px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
    </div>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-darkBase/95 backdrop-blur-2xl transition-opacity duration-1000">
        <div class="relative flex flex-col items-center max-w-md w-full px-6">
            <div class="relative mb-10 flex items-center justify-center">
                <div class="absolute w-48 h-48 rounded-full border border-neonGreen/20 animate-ping opacity-75"></div>
                <div class="absolute w-64 h-64 rounded-full border border-neonCyan/20 animate-pulse"></div>
                <div id="loader-vinyl" class="relative w-40 h-40 rounded-full bg-slate-900 border-4 border-slate-800 shadow-2xl flex items-center justify-center animate-spin-slow shadow-[0_0_40px_rgba(0,255,136,0.15)]">
                    <div class="absolute inset-2 rounded-full border border-slate-800/80"></div>
                    <div class="absolute inset-5 rounded-full border border-slate-800/80"></div>
                    <div class="absolute inset-8 rounded-full border border-slate-800/80"></div>
                    <div class="absolute inset-11 rounded-full border border-slate-800/80"></div>
                    <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-neonGreen to-neonCyan flex items-center justify-center p-0.5">
                        <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center">
                            <div class="w-3 h-3 rounded-full bg-white"></div>
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-[-15px] flex items-end justify-center gap-1.5 h-10 px-4 py-1 rounded-full bg-slate-950/80 border border-slate-800">
                    <div class="loader-bar w-1 bg-neonGreen rounded-full"></div>
                    <div class="loader-bar w-1 bg-neonCyan rounded-full"></div>
                    <div class="loader-bar w-1 bg-neonGreen rounded-full"></div>
                    <div class="loader-bar w-1 bg-neonPurple rounded-full"></div>
                    <div class="loader-bar w-1 bg-neonCyan rounded-full"></div>
                </div>
            </div>
            <h1 class="text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-neonGreen via-neonCyan to-white mb-2">AURA SOUNDS</h1>
            <p id="loader-status" class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-8">Synthesizing Audio Context...</p>
            <div class="w-full bg-slate-800/60 rounded-full h-2.5 mb-4 p-0.5 overflow-hidden border border-slate-700/50 shadow-inner">
                <div id="loader-progress-bar" class="bg-gradient-to-r from-neonGreen to-neonCyan h-full rounded-full w-0 transition-all duration-300 shadow-[0_0_12px_rgba(0,255,136,0.8)]"></div>
            </div>
            <div class="flex justify-between w-full text-xs font-mono text-slate-400 mb-8">
                <span>SYSTEM STATUS</span>
                <span id="loader-percentage" class="text-neonGreen font-bold">0%</span>
            </div>
            <button id="enter-btn" class="hidden opacity-0 transform translate-y-4 transition-all duration-500 w-full py-4 rounded-xl bg-gradient-to-r from-neonGreen to-neonCyan text-slate-950 font-bold tracking-wider uppercase shadow-[0_0_30px_rgba(0,255,136,0.4)] hover:shadow-[0_0_40px_rgba(0,229,255,0.7)] hover:scale-[1.02] active:scale-[0.98]">
                <i class="fa-solid fa-play mr-2"></i> Enter Experience
            </button>
        </div>
    </div>
    <!-- Main App -->
    <div id="app-container" class="relative z-10 flex flex-col h-screen opacity-0 transition-opacity duration-1000">
        <header class="glass-nav h-16 px-6 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-neonGreen to-neonCyan flex items-center justify-center text-slate-950 font-black text-sm">A</div>
                <span class="font-bold text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">AURA</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="/" class="text-xs text-slate-400 hover:text-neonGreen transition-colors">← Back to AKT Media</a>
            </div>
        </header>
        <div class="flex flex-1 overflow-hidden">
            <aside class="w-20 lg:w-64 glass-panel border-r-0 border-y-0 flex flex-col justify-between py-6 px-4 shrink-0">
                <nav class="space-y-2">
                    <a href="#" class="flex items-center gap-4 px-3 py-3 rounded-xl bg-gradient-to-r from-neonGreen/10 to-transparent text-neonGreen font-semibold border-l-2 border-neonGreen">
                        <i class="fa-solid fa-house text-lg w-6 text-center"></i><span class="hidden lg:inline text-sm">Discover</span>
                    </a>
                </nav>
            </aside>
            <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8">
                <section class="relative rounded-3xl overflow-hidden glass-panel border border-slate-800/80 p-6 md:p-8 flex flex-col md:flex-row gap-8 items-center">
                    <canvas id="canvas-visualizer" class="absolute inset-0 w-full h-full pointer-events-none opacity-40 z-0"></canvas>
                    <div class="relative z-10 group shrink-0">
                        <div id="main-album-wrapper" class="relative w-48 h-48 md:w-56 md:h-56 rounded-2xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.8)] border border-slate-700/50">
                            <img id="main-album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop&q=80" alt="Current Album Art" class="w-full h-full object-cover">
                        </div>
                        <div id="hero-vinyl" class="absolute -right-8 top-1/2 -translate-y-1/2 w-44 h-44 rounded-full bg-slate-950 border-2 border-slate-800 -z-10 animate-spin-slow paused-spin hidden sm:block">
                            <div class="w-12 h-12 rounded-full bg-neonGreen/80 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 border-2 border-slate-900"></div>
                        </div>
                    </div>
                    <div class="relative z-10 flex-1 text-center md:text-left space-y-3">
                        <h2 id="hero-track-title" class="text-2xl md:text-4xl font-extrabold tracking-tight text-white">Cybernetic Horizon</h2>
                        <p id="hero-track-artist" class="text-slate-400 font-medium text-sm md:text-base">Neon Synth Orchestra</p>
                        <button id="hero-action-play" class="px-6 py-3 rounded-full bg-gradient-to-r from-neonGreen to-neonCyan text-slate-950 font-bold text-xs uppercase tracking-wider shadow-[0_0_20px_rgba(0,255,136,0.3)]">
                            <i class="fa-solid fa-play mr-2"></i> Play Track
                        </button>
                    </div>
                </section>
                <section class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-bold text-white tracking-wide">Featured Tracks</h3>
                    </div>
                    <div class="grid grid-cols-1 gap-2" id="playlist-container"></div>
                </section>
            </main>
        </div>
        <footer class="glass-nav h-24 px-4 md:px-8 flex items-center justify-between shrink-0 z-20 border-t border-slate-800/80">
            <div class="flex items-center gap-4 w-1/4 min-w-[180px]">
                <img id="player-thumb" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=80" class="w-14 h-14 rounded-xl object-cover border border-slate-800 shrink-0">
                <div class="overflow-hidden">
                    <h4 id="player-title" class="text-sm font-bold text-white truncate">Cybernetic Horizon</h4>
                    <p id="player-artist" class="text-xs text-slate-400 truncate">Neon Synth Orchestra</p>
                </div>
            </div>
            <div class="flex flex-col items-center justify-center gap-2 w-2/4 max-w-xl">
                <div class="flex items-center gap-6">
                    <button id="prev-btn" class="text-slate-300 hover:text-white"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="main-play-btn" class="w-11 h-11 rounded-full bg-gradient-to-r from-neonGreen to-neonCyan text-slate-950 flex items-center justify-center"><i class="fa-solid fa-play ml-0.5"></i></button>
                    <button id="next-btn" class="text-slate-300 hover:text-white"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="flex items-center gap-3 w-full text-[11px] font-mono text-slate-400">
                    <span id="current-time">0:00</span>
                    <input id="seek-bar" type="range" min="0" max="100" value="0" class="w-full">
                    <span id="total-duration">0:00</span>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 w-1/4 min-w-[140px]">
                <button id="mute-btn" class="text-slate-400"><i id="volume-icon" class="fa-solid fa-volume-high"></i></button>
                <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" class="w-20 hidden sm:block">
            </div>
        </footer>
    </div>
    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script>
        const PLAYLIST = [
            { id: 1, title: "Cybernetic Horizon", artist: "Neon Synth Orchestra", duration: "2:45", cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600&auto=format&fit=crop&q=80", color: "#00ff88", src: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=synthwave-80s-110045.mp3" },
            { id: 2, title: "Starlight Resonance", artist: "Aetherial Pulse", duration: "3:12", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80", color: "#00e5ff", src: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=electronic-future-beats-117997.mp3" },
            { id: 3, title: "Midnight Odyssey", artist: "Vector Void", duration: "2:30", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=600&auto=format&fit=crop&q=80", color: "#a855f7", src: "https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3?filename=cyberpunk-2099-10701.mp3" },
            { id: 4, title: "Solar Drift", artist: "Hyperion Waves", duration: "3:40", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80", color: "#ff007f", src: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=retrowave-synthwave-112574.mp3" }
        ];
        let currentTrackIndex=0,isPlaying=false,audioCtx=null,analyser=null,sourceNode=null,vizMode=0;
        const loadingOverlay=document.getElementById('loading-overlay'),loaderProgressBar=document.getElementById('loader-progress-bar'),loaderPercentage=document.getElementById('loader-percentage'),loaderStatus=document.getElementById('loader-status'),enterBtn=document.getElementById('enter-btn'),appContainer=document.getElementById('app-container'),audioPlayer=document.getElementById('audio-player'),mainPlayBtn=document.getElementById('main-play-btn'),heroActionPlay=document.getElementById('hero-action-play'),prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn'),seekBar=document.getElementById('seek-bar'),currentTimeEl=document.getElementById('current-time'),totalDurationEl=document.getElementById('total-duration'),volumeSlider=document.getElementById('volume-slider'),muteBtn=document.getElementById('mute-btn'),volumeIcon=document.getElementById('volume-icon'),mainAlbumArt=document.getElementById('main-album-art'),heroTrackTitle=document.getElementById('hero-track-title'),heroTrackArtist=document.getElementById('hero-track-artist'),playerThumb=document.getElementById('player-thumb'),playerTitle=document.getElementById('player-title'),playerArtist=document.getElementById('player-artist'),heroVinyl=document.getElementById('hero-vinyl'),canvas=document.getElementById('canvas-visualizer'),canvasCtx=canvas.getContext('2d');
        window.addEventListener('DOMContentLoaded',()=>{renderPlaylist();setupCanvasSize();runPreloader();});
        window.addEventListener('resize',setupCanvasSize);
        function runPreloader(){let p=0;const iv=setInterval(()=>{p+=Math.floor(Math.random()*10)+5;if(p>=100){p=100;clearInterval(iv);setTimeout(()=>{enterBtn.classList.remove('hidden');setTimeout(()=>enterBtn.classList.remove('opacity-0','translate-y-4'),50);},200);}loaderProgressBar.style.width=p+'%';loaderPercentage.textContent=p+'%';if(p<40)loaderStatus.textContent='Initializing Audio Engine...';else if(p<70)loaderStatus.textContent='Loading Tracks...';else loaderStatus.textContent='System Ready.';},80);}
        enterBtn.addEventListener('click',()=>{initAudio();loadingOverlay.classList.add('opacity-0');setTimeout(()=>{loadingOverlay.classList.add('hidden');appContainer.classList.remove('opacity-0');loadTrack(0);},800);});
        function initAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();analyser=audioCtx.createAnalyser();analyser.fftSize=128;sourceNode=audioCtx.createMediaElementSource(audioPlayer);sourceNode.connect(analyser);analyser.connect(audioCtx.destination);drawViz();}}
        function setupCanvasSize(){const c=canvas.parentElement;canvas.width=c.clientWidth;canvas.height=c.clientHeight;}
        function drawViz(){requestAnimationFrame(drawViz);if(!analyser)return;const buf=analyser.frequencyBinCount,data=new Uint8Array(buf);canvasCtx.clearRect(0,0,canvas.width,canvas.height);analyser.getByteFrequencyData(data);const w=(canvas.width/buf)*2.5;let x=0;for(let i=0;i<buf;i++){const h=(data[i]/255)*canvas.height*0.8;const g=canvasCtx.createLinearGradient(0,canvas.height,0,0);g.addColorStop(0,'rgba(9,10,15,0)');g.addColorStop(0.5,PLAYLIST[currentTrackIndex].color+'44');g.addColorStop(1,PLAYLIST[currentTrackIndex].color);canvasCtx.fillStyle=g;canvasCtx.fillRect(x,canvas.height-h,w-2,h);x+=w;}}
        function renderPlaylist(){document.getElementById('playlist-container').innerHTML=PLAYLIST.map((t,i)=>`<div onclick="selectTrack(${i})" class="track-row glass-panel flex items-center justify-between p-3.5 rounded-2xl cursor-pointer hover:bg-slate-800/50 transition-all border border-slate-800/60 ${i===currentTrackIndex?'border-neonGreen/40 bg-slate-800/40':''}"><div class="flex items-center gap-4"><span class="text-xs font-mono w-4 text-center ${i===currentTrackIndex?'text-neonGreen':'text-slate-500'}">0${i+1}</span><img src="${t.cover}" class="w-10 h-10 rounded-xl object-cover"><div><h4 class="text-sm font-bold ${i===currentTrackIndex?'text-neonGreen':'text-white'}">${t.title}</h4><p class="text-xs text-slate-400">${t.artist}</p></div></div><span class="text-xs font-mono text-slate-500">${t.duration}</span></div>`).join('');}
        function loadTrack(i){currentTrackIndex=i;const t=PLAYLIST[i];audioPlayer.src=t.src;mainAlbumArt.src=t.cover;playerThumb.src=t.cover;heroTrackTitle.textContent=t.title;heroTrackArtist.textContent=t.artist;playerTitle.textContent=t.title;playerArtist.textContent=t.artist;document.getElementById('orb-1').style.backgroundColor=t.color;renderPlaylist();}
        function togglePlay(){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();if(isPlaying){audioPlayer.pause();isPlaying=false;updateIcons(false);heroVinyl.classList.add('paused-spin');}else{audioPlayer.play().then(()=>{isPlaying=true;updateIcons(true);heroVinyl.classList.remove('paused-spin');});}renderPlaylist();}
        function selectTrack(i){if(currentTrackIndex===i&&isPlaying)togglePlay();else{loadTrack(i);togglePlay();}}
        function updateIcons(p){const ic=p?'fa-pause':'fa-play';mainPlayBtn.innerHTML=`<i class="fa-solid ${ic} ${p?'':'ml-0.5'}"></i>`;heroActionPlay.innerHTML=`<i class="fa-solid ${ic} mr-2"></i> ${p?'Pause Track':'Play Track'}`;}
        mainPlayBtn.addEventListener('click',togglePlay);heroActionPlay.addEventListener('click',togglePlay);
        prevBtn.addEventListener('click',()=>{currentTrackIndex=(currentTrackIndex-1+PLAYLIST.length)%PLAYLIST.length;loadTrack(currentTrackIndex);if(isPlaying)audioPlayer.play();});
        nextBtn.addEventListener('click',()=>{currentTrackIndex=(currentTrackIndex+1)%PLAYLIST.length;loadTrack(currentTrackIndex);if(isPlaying)audioPlayer.play();});
        audioPlayer.addEventListener('timeupdate',()=>{if(!isNaN(audioPlayer.duration)){seekBar.value=(audioPlayer.currentTime/audioPlayer.duration)*100;currentTimeEl.textContent=formatTime(audioPlayer.currentTime);totalDurationEl.textContent=formatTime(audioPlayer.duration);}});
        seekBar.addEventListener('input',()=>{if(!isNaN(audioPlayer.duration))audioPlayer.currentTime=(seekBar.value/100)*audioPlayer.duration;});
        volumeSlider.addEventListener('input',e=>{audioPlayer.volume=e.target.value;updateVol(e.target.value);});
        muteBtn.addEventListener('click',()=>{if(audioPlayer.volume>0){audioPlayer.dataset.lv=audioPlayer.volume;audioPlayer.volume=0;volumeSlider.value=0;}else{const lv=audioPlayer.dataset.lv||0.7;audioPlayer.volume=lv;volumeSlider.value=lv;}updateVol(audioPlayer.volume);});
        function updateVol(v){if(v==0)volumeIcon.className='fa-solid fa-volume-xmark';else if(v<0.5)volumeIcon.className='fa-solid fa-volume-low';else volumeIcon.className='fa-solid fa-volume-high';}
        function formatTime(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
        audioPlayer.addEventListener('ended',()=>nextBtn.click());
    </script>
</body>
</html>
